[package]
name = "clock-study"
version = "0.3.1"
description = "Pomodoro, cronômetro e temporizador para desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
