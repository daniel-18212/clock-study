[package]
name = "clock-study"
version = "0.3.2"
description = "Pomodoro, cronômetro e temporizador para desktop e Android"
edition = "2021"

[lib]
name = "clock_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.8.1"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
time = "0.3"

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
