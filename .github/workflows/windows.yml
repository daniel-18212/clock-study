name: Clock Study Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      store_package:
        description: Preparar MSIX para submissão à Microsoft Store
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Rust
        shell: pwsh
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Instalar dependências
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath package-lock.json) { npm ci } else { npm install }
      - name: Compilar aplicativo
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ClockStudy-Windows-x64-build-sem-assinatura
          path: src-tauri/target/release/clock-study.exe
          if-no-files-found: error
      - name: Empacotar MSIX para Store
        if: github.event_name == 'workflow_dispatch' && inputs.store_package
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (-not $env:STORE_IDENTITY_NAME -or -not $env:STORE_PUBLISHER -or -not $env:STORE_PUBLISHER_DISPLAY_NAME) {
            throw 'Preencha as três variáveis de identidade da Store com os dados do Partner Center.'
          }
          ./packaging/windows/pack-msix.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.store_package
        with:
          name: ClockStudy-MSIX-para-submissao
          path: artifacts/ClockStudy-store-x64.msix
          if-no-files-found: error
