name: Clock Study Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version as a GitHub prerelease
        type: boolean
        default: false
      store_package:
        description: Prepare an MSIX for Microsoft Store submission
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check versions and documentation
        id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release }}
        run: |
          version="$(jq -er '.version' src-tauri/tauri.conf.json)"
          test "$version" = "$(jq -er '.version' package.json)"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"
          test -s README.md && test -s README.pt-BR.md
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          old_version=""
          changed=""
          build=true
          if [[ -n "$base" ]]; then
            changed="$(git diff --name-only "$base" HEAD)"
            en=0
            pt=0
            if grep -Fxq README.md <<< "$changed"; then en=1; fi
            if grep -Fxq README.pt-BR.md <<< "$changed"; then pt=1; fi
            if [[ "$en" != "$pt" ]]; then
              echo "::error::Update README.md and README.pt-BR.md together."
              exit 1
            fi
            if git cat-file -e "$base:src-tauri/tauri.conf.json" 2>/dev/null; then
              old_version="$(git show "$base:src-tauri/tauri.conf.json" | jq -er '.version')"
            fi
            if [[ -z "$(git diff --name-only "$base" HEAD -- . ':!README.md' ':!README.pt-BR.md' ':!docs/**')" ]]; then
              build=false
            fi
          fi
          publish=false
          reuse_run=""
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main &&
                "$version" == "$old_version" && "$changed" == .github/workflows/desktop.yml ]]; then
            while IFS= read -r source; do
              difference="$(git diff --name-only "$source" HEAD)"
              [[ -z "$difference" || "$difference" == .github/workflows/desktop.yml ]] || break
              candidate="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/desktop.yml/runs" \
                -f head_sha="$source" -f status=completed -f event=push \
                --jq '.workflow_runs[0].id // empty')"
              [[ -n "$candidate" ]] || continue
              formats="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
                --jq '[.artifacts[] | select(.expired | not) | .name] | sort | join(",")')"
              if [[ "$formats" == ClockStudy-android-arm64,ClockStudy-linux-x64,ClockStudy-macos-universal,ClockStudy-windows-x64 ]]; then
                reuse_run="$candidate"
                break
              fi
            done < <(git rev-list --first-parent --max-count=8 "$base")
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]] &&
             { [[ "$GITHUB_EVENT_NAME" == push && ( "$version" != "$old_version" || -n "$reuse_run" || ( "$build" == true && -s "docs/releases/$version.md" && -z "$(git tag --list "v$version")" ) ) ]] ||
               [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_REQUESTED" == true ]]; }; then
            test -s "docs/releases/$version.md"
            grep -Fxq '## English' "docs/releases/$version.md"
            grep -Fxq '## Português (Brasil)' "docs/releases/$version.md"
            publish=true
          fi
          printf 'version=%s\npublish=%s\nreuse_run=%s\nbuild=%s\n' \
            "$version" "$publish" "$reuse_run" "$build" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            bundles: nsis
            target: ''
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - platform: macos-universal
            runner: macos-15
            bundles: dmg
            target: universal-apple-darwin
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            target: ''
            path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: android-arm64
            runner: ubuntu-24.04
            path: artifacts/*_android-arm64.apk
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libfuse2 patchelf xdg-utils
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RUNNER_OS -eq 'macOS') { rustup target add aarch64-apple-darwin x86_64-apple-darwin }
      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath package-lock.json) { npm ci } else { npm install }
      - name: Build desktop installer
        if: matrix.platform != 'android-arm64'
        shell: pwsh
        env:
          BUNDLES: ${{ matrix.bundles }}
          RUST_TARGET: ${{ matrix.target }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          $buildArgs = @('run', 'tauri', 'build', '--', '--bundles', $env:BUNDLES)
          if ($env:RUST_TARGET) { $buildArgs += @('--target', $env:RUST_TARGET) }
          & npm @buildArgs
          exit $LASTEXITCODE
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android-arm64'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android-arm64'
      - name: Build and verify Android APK
        if: matrix.platform == 'android-arm64'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ndk=28.2.13676358
          tools=35.0.0
          sdkmanager "ndk;$ndk" "build-tools;$tools"
          export NDK_HOME="$ANDROID_HOME/ndk/$ndk"
          export ANDROID_NDK_HOME="$NDK_HOME"
          rustup target add aarch64-linux-android
          bash packaging/android/prepare.sh

          project=src-tauri/gen/android
          sdk="$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' "$project/app/build.gradle.kts")"
          test -n "$sdk"
          sdkmanager "platforms;android-$sdk"
          npm run tauri android build -- --apk --target aarch64

          mapfile -d '' apks < <(find "$project/app/build/outputs/apk" -type f -name '*release*.apk' -print0)
          test "${#apks[@]}" -eq 1
          mkdir -p artifacts
          output="artifacts/Clock.Study_${VERSION}_android-arm64.apk"
          apksigner="$ANDROID_HOME/build-tools/$tools/apksigner"
          keystore="$RUNNER_TEMP/clock-study-android.p12"
          umask 077
          trap 'rm -f "$keystore"' EXIT
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEYSTORE_PASSWORD
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS=clock-study-preview
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Clock Study Preview"
          fi
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" "${apks[0]}"
          "$apksigner" verify --verbose "$output"
          zipinfo -1 "$output" | awk '/^lib\/arm64-v8a\/libclock_study_lib\.so$/ { found=1 } END { exit !found }'
          "$ANDROID_HOME/build-tools/$tools/aapt2" dump badging "$output" > "$RUNNER_TEMP/clock-study-apk.txt"
          grep -F "name='android.permission.POST_NOTIFICATIONS'" "$RUNNER_TEMP/clock-study-apk.txt"
          grep -F "name='android.permission.USE_EXACT_ALARM'" "$RUNNER_TEMP/clock-study-apk.txt"
          "$ANDROID_HOME/build-tools/$tools/aapt2" dump xmltree --file AndroidManifest.xml "$output" \
            > "$RUNNER_TEMP/clock-study-manifest.txt"
          grep -F "ClockAlarmReceiver" "$RUNNER_TEMP/clock-study-manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ClockStudy-${{ matrix.platform }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          compression-level: 0
      - name: Prepare MSIX for Store submission
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.store_package
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (-not $env:STORE_IDENTITY_NAME -or -not $env:STORE_PUBLISHER -or -not $env:STORE_PUBLISHER_DISPLAY_NAME) {
            throw 'Set the three Partner Center identity variables before building the MSIX.'
          }
          ./packaging/windows/pack-msix.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.store_package
        with:
          name: ClockStudy-MSIX-for-submission
          path: artifacts/ClockStudy-store-x64.msix
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.prepare.outputs.reuse_run != '')) }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ClockStudy-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.reuse_run || github.run_id }}
      - name: Verify and publish packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob globstar
          windows=(release-assets/**/*-setup.exe)
          mac=(release-assets/**/*.dmg)
          deb=(release-assets/**/*.deb)
          appimage=(release-assets/**/*.AppImage)
          android=(release-assets/**/*_android-arm64.apk)
          for count in "${#windows[@]}" "${#mac[@]}" "${#deb[@]}" "${#appimage[@]}" "${#android[@]}"; do
            if [[ "$count" != 1 ]]; then
              echo "::error::Expected one package in each of the five supported formats."
              exit 1
            fi
          done
          packages=("${windows[@]}" "${mac[@]}" "${deb[@]}" "${appimage[@]}" "${android[@]}")
          tag="v$VERSION"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            # The Actions token can tag the current default branch, including CI-only fixes.
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "Clock Study $tag" --notes-file "docs/releases/$VERSION.md" "${packages[@]}"
          fi
          # GitHub normalizes asset names on upload. Use the published names and digests.
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -er '
            [.assets[] | select(.name | test("(-setup\\.exe|\\.dmg|\\.deb|\\.AppImage|\\.apk)$"))]
            | if length == 5 and all(.[]; (.digest // "") | test("^sha256:[a-f0-9]{64}$"))
              then sort_by(.name)[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"
              else error("Expected five published packages with SHA-256 digests")
              end
          ' <<< "$release" > release-assets/SHA256SUMS.txt
          current="$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .digest // empty' <<< "$release")"
          actual="$(sha256sum -- release-assets/SHA256SUMS.txt | cut -d ' ' -f 1)"
          if [[ "$current" != "sha256:$actual" ]]; then
            gh release upload "$tag" release-assets/SHA256SUMS.txt --clobber
          fi
